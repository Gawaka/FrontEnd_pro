<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .character-card { background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 15px; width: 300px; }
        .character-card h3 { margin-top: 0; color: #ffdd57; }
        .character-card img { max-width: 100%; height: auto; border-radius: 4px; }
        button { background: #ffdd57; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #e6c23c; }
    </style>
</head>
<body>

    <h1>Персонажі</h1>
    <button id="load-btn">Завантажити героїв</button>

    <div id="characters-container" class="container"></div>

    <script src="app.js"></script>
</body>
</html>
